# Integração contínua: a cada push e a cada Pull Request, o GitHub compila o
# projeto e roda todos os testes automáticos (JUnit 5).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Compilar e testar (Java 17)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Instalar o Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Compilar, testar e gerar o .war
        env:
          TZ: America/Sao_Paulo
        run: mvn -B -ntp verify
      - name: Guardar o relatório dos testes (se algum falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: target/surefire-reports/
          retention-days: 7
